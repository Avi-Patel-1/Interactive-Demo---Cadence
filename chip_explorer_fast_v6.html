
<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chip Explorer • Fast v6</title>
<style>
:root{ --bg:#0b0f14; --panel:#0f141b; --line:#1b232d; --teal:#00b8a9; --text:#e6edf3; --muted:#9bb4c6; }
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:#0e141b}
.brand{font-weight:800} .me{font-size:12px;color:#bfe8ff}
.tabs{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0c151d;z-index:5}
.tab{padding:6px 10px;border:1px solid #203243;border-radius:999px;background:#0f1c28;color:#b8e0ff;cursor:pointer} .tab.active{background:#132c3b;border-color:#2d6e86}
.page{display:none} .page.active{display:block}

/* Explore layout */
.wrap{display:grid;grid-template-columns:68% 32%;gap:10px;padding:10px}
.stage{height:72vh;display:flex;align-items:center;justify-content:center;background:#071018;border:1px solid #17344b;border-radius:12px;position:relative;overflow:hidden}
#view{position:absolute;inset:0;background-size:cover;background-position:center}
#lens{position:absolute;width:260px;height:260px;border-radius:50%;border:2px solid var(--teal);display:none;background-repeat:no-repeat;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.hud{position:absolute;left:10px;top:10px;background:rgba(8,14,20,.7);border:1px solid #183144;border-radius:8px;padding:6px 8px;font-size:12px}
.pill{margin-right:6px;padding:3px 6px;border:1px solid #244457;border-radius:999px;background:#0f1c28}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{padding:6px 10px;border-radius:8px;border:1px solid #1e3646;background:#0e1b26;color:#bfe8ff;cursor:pointer}
.rpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:calc(72vh);overflow:auto}
.run{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:6px;border:1px solid #1a2a38;border-radius:10px;background:#0c141c;margin-bottom:8px;cursor:pointer}
.run:hover{border-color:#265e73} .run.active{outline:2px solid var(--teal)}
.thumb{width:52px;height:52px;border-radius:8px;background-size:cover;background-position:center;border:1px solid #17344b}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.k{color:var(--muted);font-size:11px} .v{font-size:12px;font-weight:600}

/* Compare */
.comp{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.viewer{height:68vh;background:#071018;border:1px solid #17344b;border-radius:12px;position:relative;overflow:hidden}
.vimg{position:absolute;inset:0;background-size:cover;background-position:center}
.vlens{position:absolute;width:220px;height:220px;border-radius:50%;border:2px solid var(--teal);display:none;background-repeat:no-repeat}
.ctable{margin-top:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{background:#0c141c;border:1px solid #1a2a38;border-radius:8px;padding:6px;text-align:center}
.small{font-size:11px;color:#9dbbd3}
input[type=file]{display:none}

/* Charts */
.charts{padding:10px}
.chartwrap{height:72vh;background:#0b141c;border:1px solid #1a2a38;border-radius:12px;padding:8px}
.chartbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<header><div class="brand">Cadence • Chip Explorer</div><div class="me">Avi Patel — CST Digital Intern 2025</div></header>
<div class="tabs">
  <div class="tab active" data-page="explore">Explore</div>
  <div class="tab" data-page="compare">Compare</div>
  <div class="tab" data-page="charts">Charts</div>
</div>

<section id="explore" class="page active">
  <div class="wrap">
    <div>
      <div class="stage">
        <div id="view"></div>
        <div id="lens"></div>
        <div class="hud">
          <span class="pill">Freq: <span id="freq">—</span> MHz</span>
          <span class="pill">F/P: <span id="fp">—</span></span>
          <span class="pill">F/(P·A): <span id="ppa">—</span></span>
          <span class="pill">Power: <span id="pow">—</span> W</span>
          <span class="pill">Area: <span id="area">—</span> <span id="unit">mm²</span></span>
        </div>
      </div>
      <div class="controls">
        <button id="toggleLens" class="btn">Enable Lens</button>
        <label class="btn" for="upload">Upload Screenshot<input id="upload" type="file" accept="image/*"/></label>
        <button id="toggleUnits" class="btn">Area in µm²</button>
        <button id="copyRow" class="btn">Copy PPA Row</button>
      </div>
    </div>
    <div class="rpanel">
      <div style="font-weight:700;margin-bottom:6px;">Runs (ascending MHz)</div>
      <div id="runs"></div>
    </div>
  </div>
</section>

<section id="compare" class="page">
  <div class="comp">
    <div class="viewer"><div id="imgA" class="vimg"></div><div id="lensA" class="vlens"></div></div>
    <div class="viewer"><div id="imgB" class="vimg"></div><div id="lensB" class="vlens"></div></div>
  </div>
  <div class="controls" style="padding:0 10px 10px;">
    <select id="selA" class="btn"></select>
    <select id="selB" class="btn"></select>
    <label class="btn" for="upA">Upload A<input id="upA" type="file" accept="image/*"/></label>
    <label class="btn" for="upB">Upload B<input id="upB" type="file" accept="image/*"/></label>
    <button id="toggleLensAB" class="btn">Enable Lenses</button>
  </div>
  <div class="ctable" id="ctable"></div>
</section>

<section id="charts" class="page">
  <div class="charts">
    <div class="chartwrap"><canvas id="chart"></canvas></div>
    <div class="chartbar">
      <button data-kind="freqPower" class="btn">Freq vs Power</button>
      <button data-kind="perfW" class="btn">F/P (bar)</button>
      <button data-kind="ppa" class="btn">F/(P·A) (bar)</button>
      <button data-kind="stackPower" class="btn">Power breakdown</button>
      <button data-kind="slack" class="btn">Slack/WNS/TNS</button>
      <button data-kind="fpLine" class="btn">Freq vs F/P</button>
      <button data-kind="pareto" class="btn">Pareto: Power vs Freq</button>
      <button data-kind="fpArea" class="btn">F/P vs Area (bubble)</button>
      <button id="saveChart" class="btn">Export PNG</button>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(t.dataset.page).classList.add('active');

/* Explore */
let idx=0, unitMM=true, lensOn=false;
const view=document.getElementById('view'), lens=document.getElementById('lens');
const freqEl=document.getElementById('freq'), fpEl=document.getElementById('fp'), ppaEl=document.getElementById('ppa'), powEl=document.getElementById('pow'), areaEl=document.getElementById('area'), unitEl=document.getElementById('unit');
const runsEl=document.getElementById('runs');
function fx(n,d=6){ return Number(n).toFixed(d); }
function setRun(i){
  idx=i; [...document.querySelectorAll('.run')].forEach((e,k)=>e.classList.toggle('active',k===i));
  const r=DATA.runs[i];
  view.style.backgroundImage=`url('${r.image}')`; lens.style.backgroundImage=`url('${r.image}')`;
  freqEl.textContent=fx(r.freq_mhz,3); fpEl.textContent=fx(r.F_over_P); ppaEl.textContent=fx(r.PPA); powEl.textContent=fx(r.pwr_total);
  areaEl.textContent=unitMM ? fx(r.area_mm2) : r.area_um2.toLocaleString();
}
function renderRuns(){
  runsEl.innerHTML='';
  DATA.runs.forEach((r,i)=>{
    const el=document.createElement('div'); el.className='run'+(i===idx?' active':'');
    el.title = `Run ${i+1} • ${fx(r.freq_mhz,3)} MHz`; // native tooltip on hover
    el.innerHTML=`<div class="thumb" style="background-image:url('${r.image}')"></div>
      <div>
        <div style="font-weight:700;margin-bottom:4px;">Run ${i+1}</div>
        <div class="meta">
          <div><div class="k">Freq</div><div class="v">${fx(r.freq_mhz,3)} MHz</div></div>
          <div><div class="k">Power</div><div class="v">${fx(r.pwr_total)} W</div></div>
          <div><div class="k">F/P</div><div class="v">${fx(r.F_over_P)}</div></div>
          <div><div class="k">F/(P·A)</div><div class="v">${fx(r.PPA)}</div></div>
          <div><div class="k">Area</div><div class="v">${fx(r.area_mm2)} mm²</div></div>
          <div><div class="k">WNS</div><div class="v">${fx(r.wns,3)} ns</div></div>
          <div><div class="k">TNS</div><div class="v">${fx(r.tns,3)} ns</div></div>
        </div>
      </div>`;
    el.addEventListener('click',()=>setRun(i)); runsEl.appendChild(el);
  });
}
document.getElementById('toggleLens').addEventListener('click',(e)=>{ lensOn=!lensOn; e.target.textContent = lensOn ? 'Disable Lens' : 'Enable Lens'; if(!lensOn) lens.style.display='none'; });
document.getElementById('upload').addEventListener('change',(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=(ev)=>{ DATA.runs[idx].image=ev.target.result; setRun(idx); renderRuns(); }; r.readAsDataURL(f); });
document.getElementById('toggleUnits').addEventListener('click',(e)=>{ unitMM=!unitMM; unitEl.textContent=unitMM?'mm²':'µm²'; e.target.textContent = unitMM? 'Area in µm²' : 'Area in mm²'; setRun(idx); });
document.getElementById('copyRow').addEventListener('click',()=>{ const r=DATA.runs[idx]; navigator.clipboard.writeText(`Run ${idx+1}: F/P=${fx(r.F_over_P)}, F/(P·A)=${fx(r.PPA)}, Power=${fx(r.pwr_total)} W, Area=${fx(r.area_mm2)} mm^2`); });
const stage=document.querySelector('.stage');
stage.addEventListener('mousemove',(ev)=>{
  if(!lensOn) return;
  const rect=stage.getBoundingClientRect(); const x=(ev.clientX-rect.left)/rect.width; const y=(ev.clientY-rect.top)/rect.height;
  const size=lens.offsetWidth; const mx=ev.clientX-rect.left-size/2; const my=ev.clientY-rect.top-size/2;
  lens.style.display='block'; lens.style.left=Math.max(0, Math.min(rect.width-size, mx))+'px'; lens.style.top=Math.max(0, Math.min(rect.height-size, my))+'px';
  const zoom=3.0; lens.style.backgroundSize=(zoom*100)+'%'; lens.style.backgroundPosition=(x*100)+'% '+(y*100)+'%';
});
stage.addEventListener('mouseleave',()=>{ lens.style.display='none'; });

/* Compare */
const imgA=document.getElementById('imgA'), imgB=document.getElementById('imgB');
const lensA=document.getElementById('lensA'), lensB=document.getElementById('lensB');
const selA=document.getElementById('selA'), selB=document.getElementById('selB'); let lensAB=false;
function fillSelects(){ [selA, selB].forEach((sel,idx)=>{ sel.innerHTML=''; DATA.runs.forEach((r,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`Run ${i+1}`; sel.appendChild(o); }); sel.selectedIndex=idx; }); }
function updateCompare(){
  const a=DATA.runs[+selA.value], b=DATA.runs[+selB.value];
  imgA.style.backgroundImage=`url('${a.image}')`; lensA.style.backgroundImage=`url('${a.image}')`;
  imgB.style.backgroundImage=`url('${b.image}')`; lensB.style.backgroundImage=`url('${b.image}')`;
  const rows=[
    ['Freq (MHz)', a.freq_mhz, b.freq_mhz, true],
    ['Power (W)', a.pwr_total, b.pwr_total, false],
    ['Area (mm²)', a.area_mm2, b.area_mm2, false],
    ['F/P', a.F_over_P, b.F_over_P, true],
    ['F/(P·A)', a.PPA, b.PPA, true],
    ['WNS (ns)', a.wns, b.wns, true],
  ];
  const ct=document.getElementById('ctable'); ct.innerHTML='';
  rows.forEach(([k,va,vb,higher])=>{
    const delta = va!==0 ? ((vb-va)/va)*100 : 0;
    const good = higher ? delta>=0 : delta<=0;
    const el=document.createElement('div'); el.className='cell';
    el.innerHTML=`<div class="k">${k}</div><div class="v">${Number(va).toFixed(6)} → <b>${Number(vb).toFixed(6)}</b></div><div class="small" style="color:${good?'#67ffa0':'#ff7a7a'}">${delta>=0?'+':''}${isFinite(delta)?delta.toFixed(1):'—'}%</div>`;
    ct.appendChild(el);
  });
}
selA.addEventListener('change', updateCompare); selB.addEventListener('change', updateCompare);
document.getElementById('upA').addEventListener('change',(e)=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=(ev)=>{ DATA.runs[+selA.value].image=ev.target.result; updateCompare(); }; r.readAsDataURL(f); });
document.getElementById('upB').addEventListener('change',(e)=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=(ev)=>{ DATA.runs[+selB.value].image=ev.target.result; updateCompare(); }; r.readAsDataURL(f); });
document.getElementById('toggleLensAB').addEventListener('click',(e)=>{ lensAB=!lensAB; e.target.textContent = lensAB ? 'Disable Lenses' : 'Enable Lenses'; lensA.style.display = lensB.style.display = lensAB ? 'block':'none'; });
document.querySelectorAll('.viewer')[0].addEventListener('mousemove', (ev)=>{
  if(!lensAB) return; const v=document.querySelectorAll('.viewer')[0]; const r=v.getBoundingClientRect(); const x=(ev.clientX-r.left)/r.width; const y=(ev.clientY-r.top)/r.height;
  const s=lensA.offsetWidth; const mx=ev.clientX-r.left-s/2; const my=ev.clientY-r.top-s/2; lensA.style.left=Math.max(0,Math.min(r.width-s,mx))+'px'; lensA.style.top=Math.max(0,Math.min(r.height-s,my))+'px'; const z=3.0; lensA.style.backgroundSize=(z*100)+'%'; lensA.style.backgroundPosition=(x*100)+'% '+(y*100)+'%';
});
document.querySelectorAll('.viewer')[1].addEventListener('mousemove', (ev)=>{
  if(!lensAB) return; const v=document.querySelectorAll('.viewer')[1]; const r=v.getBoundingClientRect(); const x=(ev.clientX-r.left)/r.width; const y=(ev.clientY-r.top)/r.height;
  const s=lensB.offsetWidth; const mx=ev.clientX-r.left-s/2; const my=ev.clientY-r.top-s/2; lensB.style.left=Math.max(0,Math.min(r.width-s,mx))+'px'; lensB.style.top=Math.max(0,Math.min(r.height-s,my))+'px'; const z=3.0; lensB.style.backgroundSize=(z*100)+'%'; lensB.style.backgroundPosition=(x*100)+'% '+(y*100)+'%';
});

/* Charts (data-backed only; fixed parsing) */
let chartRef=null, activeKind='freqPower';
const ctx=document.getElementById('chart').getContext('2d');
function drawChart(kind){
  activeKind=kind; if(chartRef) chartRef.destroy();
  const labels = DATA.runs.map((r,i)=>'Run '+(i+1));
  const freq = DATA.runs.map(r=>r.freq_mhz);
  const power= DATA.runs.map(r=>r.pwr_total);
  const fp   = DATA.runs.map(r=>r.F_over_P);
  const ppa  = DATA.runs.map(r=>r.PPA);
  const pint = DATA.runs.map(r=>r.pwr_int);
  const psw  = DATA.runs.map(r=>r.pwr_sw);
  const slack= DATA.runs.map(r=>r.slack);
  const wns  = DATA.runs.map(r=>r.wns);
  const tns  = DATA.runs.map(r=>r.tns);
  const area = DATA.runs.map(r=>r.area_mm2);
  const palette=['#00B8A9','#4D96FF','#FFD166','#EF476F','#06D6A0','#1B9AAA','#FFA69E','#C77DFF'];
  const orderedTooltip={callbacks:{label:(ctx)=>`(${ctx.label ?? ctx.parsed.x}, ${ctx.parsed.y})`}};
  let cfg;
  if(kind==='freqPower'){
    cfg={type:'line', data:{labels:freq, datasets:[{label:'Power (W)', data:power, borderColor:palette[0], backgroundColor:palette[0], tension:.25}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{tooltip:orderedTooltip}, scales:{x:{title:{display:true,text:'Frequency (MHz)'}}, y:{title:{display:true,text:'Power (W)'}}}}
    };
  } else if(kind==='perfW'){
    cfg={type:'bar', data:{labels, datasets:[{label:'F/P (MHz/W)', data:fp, backgroundColor:palette}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:orderedTooltip}}};
  } else if(kind==='ppa'){
    cfg={type:'bar', data:{labels, datasets:[{label:'F/(P·A) (MHz/(W·mm²))', data:ppa, backgroundColor:palette}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:orderedTooltip}}};
  } else if(kind==='stackPower'){
    cfg={type:'bar', data:{labels, datasets:[{label:'Internal (W)', data:pint, backgroundColor:palette[1], stack:'p'},{label:'Switching (W)', data:psw, backgroundColor:palette[2], stack:'p'}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{tooltip:orderedTooltip}, scales:{x:{stacked:true}, y:{stacked:true}}}};
  } else if(kind==='slack'){
    cfg={type:'line', data:{labels:freq, datasets:[{label:'Slack (ns)', data:slack, borderColor:palette[3], backgroundColor:palette[3], tension:.25},{label:'WNS (ns)', data:wns, borderColor:palette[4], backgroundColor:palette[4], tension:.25},{label:'TNS (ns)', data:tns, borderColor:palette[5], backgroundColor:palette[5], tension:.25}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{tooltip:orderedTooltip}, scales:{x:{title:{display:true,text:'Frequency (MHz)'}}, y:{title:{display:true,text:'Time (ns)'}}}}};
  } else if(kind==='fpLine'){
    cfg={type:'line', data:{labels:freq, datasets:[{label:'F/P (MHz/W)', data:fp, borderColor:palette[6], backgroundColor:palette[6], tension:.25}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{tooltip:orderedTooltip}, scales:{x:{title:{display:true,text:'Frequency (MHz)'}}, y:{title:{display:true,text:'F/P (MHz/W)'}}}}};
  } else if(kind==='pareto'){
    cfg={type:'scatter', data:{datasets:[{label:'Power vs Frequency (size ∝ area)', data:freq.map((x,i)=>({x, y:power[i], r:Math.max(6, Math.min(18, area[i]/max(area)*18))})), parsing:{xAxisKey:'x', yAxisKey:'y'}, pointBackgroundColor:palette}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{tooltip:{callbacks:{label:(ctx)=>`(${ctx.raw.x}, ${ctx.raw.y})`}}}, scales:{x:{title:{display:true,text:'Frequency (MHz)'}}, y:{title:{display:true,text:'Power (W)'}}}}};
  } else if(kind==='fpArea'){
    cfg={type:'scatter', data:{datasets:[{label:'F/P vs Area (size ∝ power)', data:area.map((x,i)=>({x, y:fp[i], r:Math.max(6, Math.min(18, power[i]/max(power)*18))})), parsing:{xAxisKey:'x', yAxisKey:'y'}, pointBackgroundColor:palette}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{tooltip:{callbacks:{label:(ctx)=>`(${ctx.raw.x}, ${ctx.raw.y})`}}}, scales:{x:{title:{display:true,text:'Area (mm²)'}}, y:{title:{display:true,text:'F/P (MHz/W)'}}}}};
  }
  chartRef = new Chart(ctx, cfg);
  document.getElementById('chart').onclick = (evt)=>{
    const points = chartRef.getElementsAtEventForMode(evt, 'nearest', {intersect:true}, true);
    if(points.length){ setRun(points[0].index); document.querySelector('.tab[data-page="explore"]').click(); }
  };
}
function max(arr){ return Math.max.apply(null, arr); }
document.querySelectorAll('#charts .btn').forEach(b=>{
  const k=b.getAttribute('data-kind'); if(!k) return;
  b.addEventListener('click', ()=> drawChart(k));
});
document.getElementById('saveChart').addEventListener('click', ()=>{ if(!chartRef) return; const a=document.createElement('a'); a.download='chart.png'; a.href=chartRef.toBase64Image(); a.click(); });

/* Init */
function init(){ renderRuns(); setRun(0); fillSelects(); updateCompare(); drawChart('freqPower'); }
init();
</script>
</body>
